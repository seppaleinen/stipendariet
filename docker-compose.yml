name: stipendariet

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - stipendariet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - stipendariet

  # browserless is now optional - uncomment if needed for Playwright rendering
# browserless:
#     image: browserless/chrome:latest
#     container_name: browserless
#     ports:
#       - "9222:9222"
#     networks:
#       - stipendariet

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    networks:
      - stipendariet
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    restart: unless-stopped

  backend:
    image: seppaleinen/stipendariet-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: backend
    expose:
      - "8000"
    volumes:
      - ./data/backend:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_EMAIL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LITELLM_URL=${LITELLM_URL:-http://host.docker.internal:4000}
      - LITELLM_TEXT_MODEL=${LITELLM_TEXT_MODEL:-gemma-4-12b}
    restart: unless-stopped
    networks:
      - stipendariet
    depends_on:
      postgres:
        condition: service_healthy

  enrichment-worker:
    image: seppaleinen/stipendariet-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: enrichment-worker
    command: ["arq", "app.workers.enrichment_worker.WorkerSettings"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      # BROWSERLESS_URL is now optional - uncomment if browserless service is enabled
      # - BROWSERLESS_URL=http://browserless:3000
      - SEARXNG_URL=http://searxng:8080
      - LITELLM_URL=${LITELLM_URL:-http://host.docker.internal:4000}
      - LITELLM_TEXT_MODEL=${LITELLM_TEXT_MODEL:-gemma-4-12b}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    restart: unless-stopped
    networks:
      - stipendariet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: seppaleinen/stipendariet-frontend:latest
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        - VITE_API_URL=/api
    container_name: frontend
    ports:
      # Host port moved 8080 -> 8082: host 8080 is reserved for SearXNG
      # (enrichment pipeline v2, Phase 0). Internal container port stays 8080.
      - "8082:8080"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=/api
    restart: unless-stopped
    networks:
      - stipendariet

  admin-frontend:
    image: seppaleinen/stipendariet-admin:latest
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: admin-frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_BACKEND_URL=http://backend:8000/api
    restart: unless-stopped
    networks:
      - stipendariet

networks:
  stipendariet:
    driver: bridge
    name: stipendariet
