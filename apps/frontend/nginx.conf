worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    upstream api {
      # for UNIX domain socket setups
      server backend:8000 max_fails=3 fail_timeout=10s;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        listen 8080;
        server_name localhost;
        root /app/dist;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Handle React Router (SPA routing)
        location / {
            try_files $uri $uri/ /index.html;
        }
        # llms.txt is generated at build time and updated on each deploy.
        # Short cache TTL ensures crawlers see fresh content without blocking
        # the build-push-deploy pipeline (immutable assets use 1y via digest).
        location = /llms.txt {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Handle API calls (if needed)
        location /api/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Host $host;
            # we don't want nginx trying to do something clever with
            # redirects, we set the Host: header above already.
            proxy_redirect off;

            # Proxy to backend if needed
            proxy_pass http://api;
        }

        # On-demand SSR fallback for grant detail pages.
        #
        # Build-time prerendering only covers ~500 grants; the remaining
        # ~16.5k /grants/<id> URLs are rendered on-demand by the SSR sidecar
        # (node scripts/ssr-server.js, listening on :3001 in the same pod).
        # Serve any static dist/grants/<id>/index.html hit directly; otherwise
        # fall through to the sidecar which renders + caches the page (1h).
        #
        # The /grants list (no trailing id segment) does NOT match this regex
        # and continues to serve its build-time-prerendered page via location /.
        location ~ ^/grants/([^/]+)/?$ {
            try_files /grants/$1/index.html $uri = @ssr;
        }

location @ssr {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_pass http://127.0.0.1:3001;
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://127.0.0.1:3001;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}
