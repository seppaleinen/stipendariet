apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{  .Release.Name }}
    name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      name: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: {{ .Release.Name }}
    spec:
      containers:
        # ── Nginx (static assets + SSR proxy) ─────────────────────────────────
        # Serves pre-rendered pages and assets from dist/. Proxies /grants/<id>
        # requests that miss the on-disk cache to the SSR sidecar (port 3001).
        - name: nginx
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            {{ toYaml .Values.resources | nindent 12 }}
        {{- if .Values.ssr.enabled }}
        # ── SSR Server (on-demand grant page rendering) ─────────────────────
        # Express SSR fallback: renders /grants/<id> pages dynamically by fetching
        # from the backend API when no static prerendered file exists on disk.
        # Tech SEO fix — enables crawlers to index grant detail pages.
        - name: ssr
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VITE_API_URL
              value: {{ .Values.ssrApiUrl | quote }}
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            {{- with .Values.ssr.envs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: ssr
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: ssr
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: ssr
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: ssr
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.ssr.resources | nindent 12 }}
        {{- end }}
      restartPolicy: Always
