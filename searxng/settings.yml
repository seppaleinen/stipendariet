# SearXNG settings for stipendariet enrichment pipeline
# Enables JSON output and multiple search engines for Swedish foundation discovery
#
# Each engine needs both `name` (display) and `engine` (Python module).
# See: https://docs.searxng.org/admin/settings/settings_engines.html

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: ""
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "sv"

engines:
  # Primary engines for Swedish foundation discovery
  - name: google
    engine: google
    disabled: false
  - name: bing
    engine: bing
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
  - name: brave
    engine: brave
    disabled: false

formats:
  - html
  - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20