# SearXNG settings for stipendariet enrichment pipeline
# Based on default template with overrides for JSON output and 4 engines
# See: https://docs.searxng.org/admin/settings/

use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG - Stipendariet"
  donation_url: "https://docs.searxng.org/donate.html"
  enable_metrics: true

search:
  safe_search: 0
  default_lang: "sv"
  formats:
    - html
    - json
    - csv
    - rss

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "changeme-dev-only"
  limiter: false
  image_proxy: false
  public_instance: false
  method: "GET"

valkey:
  url: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

engines:
  - name: google
    engine: google
    shortcut: "g"
    disabled: false
  - name: bing
    engine: bing
    shortcut: "b"
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: "d"
    disabled: false
  - name: brave
    engine: brave
    shortcut: "br"
    disabled: false
